[project]
name = "se-analysis"
version = "0.1.0"
description = "Analysis helpers for Solutions Engineering data QC"
readme = "README.md"
authors = [
    { name = "Brendan Taylor", email = "bft@nrgsystems.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nrgpy>=2.3.13",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests assert on physical quantities, so a bare `assert a == b` on floats is
# almost never what is meant; -q keeps the run readable from a notebook terminal.
addopts = "-q --strict-markers"


[tool.black]
target-version = ["py313"]
# Notebooks are formatted by hand, not by black.
extend-exclude = '''
(
    \.ipynb$
  | \.venv/
)
'''
